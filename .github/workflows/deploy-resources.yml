name: deploy-resources
on:
  workflow_dispatch:
    inputs:
      mode:
        description: what-if previews changes; deploy applies them.
        type: choice
        options: [what-if, deploy]
        default: what-if

permissions:
  id-token: write   # OIDC token request
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1        # connectivity first, spokes after
      fail-fast: true
      matrix:
        workload: [connectivity, operations, corp, online]
    environment: prod-${{ matrix.workload }}   # selects the identity AND its secrets
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy workload (${{ inputs.mode }})
        env:
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$MODE" = "deploy" ]; then ACTION=create; else ACTION=what-if; fi
          az deployment sub "$ACTION" \
            --name "res-${{ matrix.workload }}-${{ github.run_number }}" \
            --location centralus \
            --template-file environments/prod/${{ matrix.workload }}.bicep